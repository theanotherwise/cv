name: Build CV tag

on:
  push:
    tags:
      - cv-*

permissions:
  contents: read

concurrency:
  group: build-cv-tag-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  build:
    name: Render PDF
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.ref }}
          persist-credentials: false

      - name: Validate CV tag
        env:
          CV_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          if [[ ! "${CV_TAG}" =~ ^cv-[0-9]{4}-[0-9]{2}-[0-9]{2}-[0-9a-f]{7}$ ]]; then
            echo "Invalid CV tag: ${CV_TAG}" >&2
            echo "Expected: cv-YYYY-MM-DD-abcdef0" >&2
            exit 1
          fi

          cv_date="${CV_TAG:3:10}"
          if [[ "$(date --date="${cv_date}" +%F 2>/dev/null)" != "${cv_date}" ]]; then
            echo "Invalid date in CV tag: ${cv_date}" >&2
            exit 1
          fi

          expected_sha="$(git rev-parse --short=7 HEAD)"
          tag_sha="${CV_TAG##*-}"
          if [[ "${tag_sha}" != "${expected_sha}" ]]; then
            echo "CV tag SHA ${tag_sha} does not match commit ${expected_sha}" >&2
            exit 1
          fi

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.8"
          enable-cache: false

      - name: Install Python
        run: uv python install 3.13

      - name: Build CV
        run: |
          mkdir -p output/pdf
          uvx \
            --python 3.13 \
            --from 'rendercv[full]==2.8' \
            rendercv render CV.yaml \
            --pdf-path output/pdf/cv.pdf \
            --typst-path output/pdf/cv.typ \
            --dont-generate-markdown \
            --dont-generate-html \
            --dont-generate-png
          test -s output/pdf/cv.pdf

      - name: Upload PDF
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cv-pdf
          path: output/pdf/cv.pdf
          if-no-files-found: error
          retention-days: 30
