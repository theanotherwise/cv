name: CV

on:
  push:
    tags:
      - cv-*

permissions:
  contents: read

concurrency:
  group: build-cv-tag-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.ref }}
          persist-credentials: false

      - name: Verify
        env:
          CV_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          if [[ ! "${CV_TAG}" =~ ^cv-[0-9]{12}-[0-9a-f]{7}$ ]]; then
            echo "Invalid CV tag: ${CV_TAG}" >&2
            echo "Expected: cv-YYMMDDHHMMSS-abcdef0" >&2
            exit 1
          fi

          cv_timestamp="${CV_TAG:3:12}"
          cv_datetime="20${cv_timestamp:0:2}-${cv_timestamp:2:2}-${cv_timestamp:4:2} ${cv_timestamp:6:2}:${cv_timestamp:8:2}:${cv_timestamp:10:2}"
          if [[ "$(date --date="${cv_datetime}" +%y%m%d%H%M%S 2>/dev/null)" != "${cv_timestamp}" ]]; then
            echo "Invalid timestamp in CV tag: ${cv_timestamp}" >&2
            exit 1
          fi

          expected_sha="$(git rev-parse --short=7 HEAD)"
          tag_sha="${CV_TAG##*-}"
          if [[ "${tag_sha}" != "${expected_sha}" ]]; then
            echo "CV tag SHA ${tag_sha} does not match commit ${expected_sha}" >&2
            exit 1
          fi

  build:
    name: Build
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.ref }}
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.8"
          enable-cache: false

      - name: Install Python
        run: uv python install 3.13

      - name: Build
        run: |
          mkdir -p output/pdf
          uvx \
            --python 3.13 \
            --from 'rendercv[full]==2.8' \
            rendercv render CV.yaml \
            --pdf-path output/pdf/cv.pdf \
            --typst-path output/pdf/cv.typ \
            --dont-generate-markdown \
            --dont-generate-html \
            --dont-generate-png
          test -s output/pdf/cv.pdf

      - name: Upload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cv-pdf
          path: output/pdf/cv.pdf
          if-no-files-found: error
          retention-days: 30
